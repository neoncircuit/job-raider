# Job Raider - Docker Compose
# Development and production configuration


services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: job-raider-backend
    user: root
    ports:
      - target: 8000
        published: "${BACKEND_PORT:-8000}"
        protocol: tcp
        mode: host
    volumes:
      - ./apps/backend-py/data:/app/backend-py/data
    env_file:
      - apps/backend-py/.env
    environment:
      - PYTHONPATH=/app/backend-py
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Host-machine Ollama (not baked into this image; not a Compose service).
      # Inside the backend container, localhost is the container itself — use
      # host.docker.internal to reach Ollama on Windows/macOS Docker Desktop.
      # Native (non-Docker) runs still use localhost via Settings / .env.
      # Do not inherit OLLAMA_HOST=0.0.0.0 from the host shell.
      - OLLAMA_HOST=host.docker.internal:11434
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    restart: unless-stopped
    networks:
      - job-raider-network
      - shared-services

  # Next.js Dashboard
  frontend:
    build:
      context: ./apps/frontend-ts
      dockerfile: Dockerfile
    container_name: job-raider-frontend
    ports:
      - target: 3000
        published: "${FRONTEND_PORT:-3000}"
        protocol: tcp
        mode: host
    environment:
      - BACKEND_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000
    env_file:
      - apps/frontend-ts/.env.local
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - job-raider-network

networks:
  job-raider-network:
    driver: bridge
  shared-services:
    external: true
