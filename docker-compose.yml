# Job Raider - Docker Compose
# Development and production configuration


services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: job-raider-backend
    user: root
    ports:
      - target: 8000
        published: "${BACKEND_PORT:-8000}"
        protocol: tcp
        mode: host
    volumes:
      - ./apps/backend-py/data:/app/backend-py/data
    environment:
      - PYTHONPATH=/app/backend-py
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Ollama configuration with fallback chain:
      # 1. User-specified OLLAMA_HOST
      # 2. ollama:11434 for Docker Ollama service (production)
      # 3. host.docker.internal:11434 for local Ollama (development)
      # 4. localhost:11434 for local development without Docker
      - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    env_file:
      - apps/backend-py/.env
    restart: unless-stopped
    networks:
      - job-raider-network

  # MLflow tracking server
  mlflow:
    image: mlflow/mlflow:v2.13.2
    container_name: job-raider-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./data/mlflow:/mlflow
    networks:
      - job-raider-network
    restart: unless-stopped

  # Next.js Dashboard
  frontend:
    build:
      context: ./apps/frontend-ts
      dockerfile: Dockerfile
    container_name: job-raider-frontend
    ports:
      - target: 3000
        published: "${FRONTEND_PORT:-3000}"
        protocol: tcp
        mode: host
    environment:
      - BACKEND_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000
    env_file:
      - apps/frontend-ts/.env.local
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - job-raider-network

networks:
  job-raider-network:
    driver: bridge
