# Job Raider - Docker Compose
# Development and production configuration


services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: job-raider-backend
    user: root
    ports:
      - target: 8000
        published: "${BACKEND_PORT:-8000}"
        protocol: tcp
        mode: host
    volumes:
      - ./apps/backend-py/data:/app/backend-py/data
    env_file:
      - apps/backend-py/.env
    environment:
      - PYTHONPATH=/app/backend-py
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Compose-network default. Do not inherit a host OLLAMA_HOST of 0.0.0.0 /
      # localhost from the shell or .env — those break in-container health checks.
      # Runtime LLM + Settings discovery still use api_config.ollama_host
      # (e.g. host.docker.internal:11434 for desktop Ollama).
      - OLLAMA_HOST=ollama:11434
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    restart: unless-stopped
    networks:
      - job-raider-network
      - shared-services

  # Next.js Dashboard
  frontend:
    build:
      context: ./apps/frontend-ts
      dockerfile: Dockerfile
    container_name: job-raider-frontend
    ports:
      - target: 3000
        published: "${FRONTEND_PORT:-3000}"
        protocol: tcp
        mode: host
    environment:
      - BACKEND_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000
    env_file:
      - apps/frontend-ts/.env.local
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - job-raider-network

networks:
  job-raider-network:
    driver: bridge
  shared-services:
    external: true
