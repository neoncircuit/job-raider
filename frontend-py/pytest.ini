# Job Raider - Frontend Pytest Configuration
#
# Pytest configuration for the Streamlit dashboard test suite.

[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests

addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=5

markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use external services)
