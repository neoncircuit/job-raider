# Job Raider - CI/CD Pipeline
#
# This workflow runs linting, type checking, and tests on every push
# and pull request to ensure code quality.
#
# Author: Job Raider
# Date: 2026-04-22

name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: every job only needs to read repo contents.
# Artifact/coverage uploads and Docker Hub publishing use their own secrets,
# not the workflow token, so nothing here requires write access.
permissions:
  contents: read

# Cancel superseded runs on PRs and develop to free runners and save minutes,
# but let main/tag runs finish so every release commit keeps an uninterrupted
# CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  secrets-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so every new commit is scanned, not just HEAD
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: apps/backend-py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check code formatting with Black
        run: black --check src/ tests/

      - name: Lint with Ruff
        run: ruff check src/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: apps/backend-py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-requests types-PyYAML
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/backend-py

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: apps/backend-py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-mock
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=term --verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./apps/backend-py/coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  lint-frontend:
    name: Lint Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-ts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend-ts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run ESLint
        run: |
          npm run lint

  type-check-frontend:
    name: Type Check Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-ts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend-ts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run TypeScript type check
        run: |
          npm run type-check

  test-frontend-unit:
    name: Test Frontend (Unit Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-ts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend-ts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run unit tests with coverage
        run: |
          npm run test:coverage -- --run --reporter=verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./apps/frontend-ts/coverage/lcov.info
          flags: frontend-unit
          name: codecov-frontend-unit
        continue-on-error: true

  format-check-frontend:
    name: Check Next.js Frontend Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-ts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend-ts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Check Prettier formatting
        run: |
          npm run format:check

  build-frontend:
    name: Build Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-ts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend-ts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Build Next.js application
        run: |
          npm run build

  test-frontend-e2e:
    name: Test Frontend (E2E Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-ts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend-ts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend-ts/playwright-report/
          retention-days: 7
        continue-on-error: true

      - name: Upload Playwright screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: apps/frontend-ts/test-results/
          retention-days: 7
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version-file: '.python-version'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security linter
        run: bandit -r src/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run Safety check
        run: safety check --json || true
        continue-on-error: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-backend, lint-frontend, type-check-frontend, format-check-frontend, build-frontend, test-frontend-unit]
    # Publish only on deliberate triggers, not on every main push: building the
    # CUDA image is heavy, `:latest` should not move per-commit, and the job
    # needs Docker Hub secrets that aren't always configured. Cut a `v*` tag to
    # release, or run manually (workflow_dispatch) once DOCKER_USERNAME /
    # DOCKER_PASSWORD secrets are set.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/job-raider:latest
            ${{ secrets.DOCKER_USERNAME }}/job-raider:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
