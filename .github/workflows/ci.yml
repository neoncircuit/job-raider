# Job Raider - CI/CD Pipeline
#
# This workflow runs linting, type checking, and tests on every push
# and pull request to ensure code quality.
#
# Author: Job Raider
# Date: 2026-04-22

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend-py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black pylint flake8 isort mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check code formatting with Black
        run: black --check src/ tests/

      - name: Check import ordering with isort
        run: isort --check-only src/ tests/

      - name: Lint with flake8
        run: flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint with pylint
        run: pylint src/ --errors-only --fail-under=9.0 || true
        continue-on-error: true

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend-py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-requests types-PyYAML
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend-py

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend-py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-mock
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=term --verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend-py/coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-py

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: frontend-py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run frontend tests
        run: |
          PYTHONPATH=. pytest tests/ -v

  lint-frontend:
    name: Lint Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-ts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-ts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run ESLint
        run: |
          npm run lint

  type-check-frontend:
    name: Type Check Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-ts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-ts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run TypeScript type check
        run: |
          npm run type-check

  test-frontend-unit:
    name: Test Frontend (Unit Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-ts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-ts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run unit tests with coverage
        run: |
          npm run test:coverage -- --run --reporter=verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend-ts/coverage/lcov.info
          flags: frontend-unit
          name: codecov-frontend-unit
        continue-on-error: true

  test-frontend-e2e:
    name: Test Frontend (E2E Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-ts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-ts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: frontend-ts/playwright-report/
          retention-days: 7
        continue-on-error: true

      - name: Upload Playwright screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-screenshots
          path: frontend-ts/test-results/
          retention-days: 7
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security linter
        run: bandit -r src/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run Safety check
        run: safety check --json || true
        continue-on-error: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-backend, lint-frontend, type-check-frontend, test-frontend-unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/job-raider:latest
            ${{ secrets.DOCKER_USERNAME }}/job-raider:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
