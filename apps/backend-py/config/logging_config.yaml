# Job Raider - Logging Configuration
# Structured logging setup for development and production

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(message)s %(filename)s %(lineno)d %(funcName)s"

  colored:
    (): colorlog.ColoredFormatter
    format: "%(log_color)s%(asctime)s - %(name)s - %(levelname)s - %(message)s%(reset)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    log_colors:
      DEBUG: cyan
      INFO: green
      WARNING: yellow
      ERROR: red
      CRITICAL: red,bg_white

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: colored
    stream: ext://sys.stdout

  console_debug:
    class: logging.StreamHandler
    level: DEBUG
    formatter: detailed
    stream: ext://sys.stdout

  file_main:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: data/logs/job_raider.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  file_debug:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: data/logs/debug.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  file_json:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: data/logs/structured.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  file_errors:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: data/logs/errors.log
    maxBytes: 10485760  # 10MB
    backupCount: 10
    encoding: utf-8

  # Token usage specific log
  file_tokens:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: data/logs/tokens.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

loggers:
  # Root logger
  root:
    level: INFO
    handlers: [console, file_main, file_errors]
    propagate: false

  # Application logger
  job_raider:
    level: INFO
    handlers: [console, file_main, file_json]
    propagate: false

  # Component-specific loggers
  job_raider.scrapers:
    level: INFO
    handlers: [console, file_main]
    propagate: false

  job_raider.llm:
    level: INFO
    handlers: [console, file_main, file_json]
    propagate: false

  job_raider.llm.tokens:
    level: INFO
    handlers: [file_tokens]
    propagate: false

  job_raider.scoring:
    level: DEBUG
    handlers: [console_debug, file_debug]
    propagate: false

  job_raider.generation:
    level: INFO
    handlers: [console, file_main]
    propagate: false

  job_raider.pipeline:
    level: INFO
    handlers: [console, file_main]
    propagate: false

  # External library loggers
  playwright:
    level: WARNING
    handlers: [file_errors]
    propagate: false

  httpx:
    level: WARNING
    handlers: [file_errors]
    propagate: false

  anthropic:
    level: WARNING
    handlers: [file_errors]
    propagate: false

# === Structlog Configuration (alternative) ===
structlog:
  version: 1
  processors:
    - structlog.stdlib.filter_by_level
    - structlog.stdlib.add_logger_name
    - structlog.stdlib.add_log_level
    - structlog.stdlib.PositionalArgumentsFormatter
    - structlog.processors.TimeStamper(fmt="iso")
    - structlog.processors.StackInfoRenderer
    - structlog.processors.format_exc_info
    - structlog.processors.UnicodeDecoder

  context_class:
    - structlog.threadlocal.ThreadLocalDict
    - structlog.contextvars.ContextVars

  logger_factory:
    class: structlog.stdlib.LoggerFactory

  wrapper_class:
    class: structlog.stdlib.BoundLogger

  processors:
    - structlog.dev.ConsoleRenderer
    - structlog.processors.JSONRenderer
