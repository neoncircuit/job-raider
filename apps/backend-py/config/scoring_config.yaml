# Job Raider - Scoring Configuration
# Heuristic scoring weights and thresholds

# Scoring weights (total 100 points)
weights:
  keyword: 30       # Keyword overlap with target keywords
  skills: 40        # Skills match against user profile
  experience: 20     # Experience level alignment
  location: 10       # Location and remote preference

# Fresh graduate mode weights (prioritizes potential and projects)
fresh_grad_weights:
  projects: 35       # Academic projects, portfolio, hackathons
  skills: 30         # Skills match against user profile
  education: 20      # University quality, major relevance, achievements
  experience: 10     # Reduced emphasis on work experience
  location: 5        # Location and remote preference

# Scoring thresholds
thresholds:
  apply: 60          # Minimum score to "apply"
  strong_match: 72   # 120% of apply threshold (strong match)
  maybe: 42          # 70% of apply threshold (maybe)
  excellent_skill_overlap: 80  # Percentage for "excellent" skill match
  good_skill_overlap: 60       # Percentage for "good" skill match
  partial_skill_overlap: 40    # Percentage for "partial" skill match

# Quick filter settings
quick_filter:
  reject_patterns:
    - "director"
    - "vp "
    - "vice president"
    - "cto"
    - "chief"
    - "unpaid"
    - "volunteer"
    - "contract to hire"
  max_age_days: 60   # Reject jobs older than this

# Fresh grad quick filter (allows internships and entry-level)
fresh_grad_quick_filter:
  reject_patterns:
    - "director"
    - "vp "
    - "vice president"
    - "cto"
    - "chief"
    - "senior"
    - "lead"
    - "principal"
    - "10+ years"
    - "unpaid"
    - "contract to hire"
  keep_patterns:
    - "entry level"
    - "junior"
    - "associate"
    - "graduate"
    - "internship"
    - "0-2 years"
    - "recent graduate"
  max_age_days: 90   # Allow older job postings for fresh grads

# Filter settings
filter:
  remote_only: false  # Only show remote jobs
  require_salary: false  # Only show jobs with salary info
  min_skill_match: 0.5  # Require 50% of skills to match

# Default target keywords
default_keywords:
  - "fintech"
  - "AI"
  - "SWE"
  - "software engineer"
  - "machine learning"
  - "data science"
  - "python"
  - "javascript"

# Default target locations (primary: Singapore)
default_locations:
  - "Singapore"
  - "Remote"

# Experience level mappings
experience_levels:
  entry:
    range: [0, 2]
    keywords: ["entry level", "junior", "0-2 years", "recent graduate"]
  mid:
    range: [2, 5]
    keywords: ["mid level", "mid-level", "intermediate", "2-5 years", "3-5 years"]
  senior:
    range: [5, 10]
    keywords: ["senior", "5+ years", "5-10 years", "experienced"]
  lead:
    range: [10, 15]
    keywords: ["lead", "staff", "principal", "10+ years"]

# Skill categories for matching
skill_categories:
  programming_languages:
    - "Python"
    - "JavaScript"
    - "TypeScript"
    - "Java"
    - "C++"
    - "Go"
    - "Rust"
    - "Ruby"
    - "PHP"
    - "Swift"
    - "Kotlin"
    - "Scala"
    - "R"
    - "MATLAB"
    - "SQL"

  frameworks:
    - "React"
    - "Angular"
    - "Vue"
    - "Next.js"
    - "Django"
    - "Flask"
    - "FastAPI"
    - "Spring"
    - "Express.js"
    - "Node.js"
    - ".NET"

  tools:
    - "Git"
    - "Docker"
    - "Kubernetes"
    - "Terraform"
    - "Ansible"
    - "Jenkins"
    - "GitHub"
    - "GitLab"
    - "CI/CD"

  cloud:
    - "AWS"
    - "Azure"
    - "GCP"
    - "CloudFormation"
    - "Terraform"

  databases:
    - "PostgreSQL"
    - "MySQL"
    - "MongoDB"
    - "Redis"
    - "Elasticsearch"
    - "GraphQL"
    - "REST"

  domains:
    - "Machine Learning"
    - "Deep Learning"
    - "AI"
    - "Data Science"
    - "Web Development"
    - "Mobile Development"
    - "DevOps"
    - "Backend"
    - "Frontend"
    - "Full Stack"

# Fresh graduate specific scoring criteria
fresh_grad_scoring:
  education:
    university_tiers:
      tier1: ["MIT", "Stanford", "Carnegie Mellon", "UC Berkeley", "Harvard", "Princeton"]
      tier2: ["Georgia Tech", "UIUC", "University of Washington", "UT Austin", "University of Michigan"]
      tier3: ["State universities", "Regional universities"]
    relevant_majors:
      - "Computer Science"
      - "Software Engineering"
      - "Data Science"
      - "Computer Engineering"
      - "Information Technology"
      - "Mathematics"
      - "Statistics"
      - "Physics"
    gpa_weighting:
      excellent: [3.5, 4.0]  # 20 points
      good: [3.0, 3.5]       # 15 points
      average: [2.5, 3.0]     # 10 points
      below_average: [0, 2.5] # 5 points

  projects:
    categories:
      academic_capstone: 20     # Senior design/final year project
      personal_projects: 15    # GitHub portfolio, personal apps
      hackathon: 10           # Hackathon participation/awards
      research: 15             # Published research, papers
    quality_indicators:
      - "GitHub repository with stars/forks"
      - "Deployed application"
      - "Open source contributions"
      - "Technical blog posts"
      - "Comprehensive documentation"
      - "Test coverage"

  internships:
    relevant_experience:
      - "Software development internship"
      - "Research assistant"
      - "Teaching assistant (CS)"
      - "Tech startup experience"
    quality_scoring:
      tech_company: 15         # Known tech company
      startup: 12              # Early-stage startup
      research_lab: 10         # Academic research position
      general: 8               # Other relevant experience
