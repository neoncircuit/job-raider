# Job Raider - Backend Pytest Configuration
#
# Pytest configuration for the backend test suite.

[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests
norecursedirs = tests/manual

# Put the project root on sys.path so `import src.*` resolves when pytest is
# invoked as the `pytest` console entry point (as in CI). Unlike `python -m
# pytest`, the console script does not add the working directory to sys.path,
# so without this the test modules fail at collection with
# `ModuleNotFoundError: No module named 'src'`.
pythonpath = .

addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=5

markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use external services)
    slow: Slow tests (may take >1 minute)
    scraping: Tests that perform actual web scraping
    llm: Tests that call LLM APIs (use with caution)
    gpu: Tests that require GPU/VRAM
